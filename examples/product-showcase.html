<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Product Showcase Component — AETumi</title>
<!--
  A reusable "product showcase" component:
  a floating rounded platform with a product spinning on a turntable,
  soft studio lighting via an image-based environment (RoomEnvironment),
  and three material-variant buttons that hot-swap color / roughness /
  metalness on the product.

  Drop the <div id="showcase"> + this module into any page. The UI overlay
  is plain HTML/CSS so it themes with your site.

  Three.js r160 (ES modules via importmap: three from cdnjs, addons from jsdelivr).
-->
<style>
  :root { --bg: #0e1016; --panel: rgba(255,255,255,.06); --ink: #eef1f8; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  #showcase { position: fixed; inset: 0; }
  canvas { display: block; }
  .ui {
    position: fixed; left: 0; right: 0; bottom: 28px;
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
  }
  .ui button {
    appearance: none; cursor: pointer; color: var(--ink);
    background: var(--panel); border: 1px solid rgba(255,255,255,.14);
    padding: 12px 20px; border-radius: 999px; font-size: 0.95rem;
    backdrop-filter: blur(8px); transition: transform .15s, border-color .15s;
  }
  .ui button:hover { transform: translateY(-2px); }
  .ui button[aria-pressed="true"] { border-color: #7c8bff; box-shadow: inset 0 0 0 1px #7c8bff; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
  .title { position: fixed; top: 28px; left: 0; right: 0; text-align: center; }
  .title h2 { margin: 0; font-weight: 600; letter-spacing: -0.02em; }
  .title p { margin: 4px 0 0; color: #9aa3c4; font-size: 0.9rem; }
</style>
</head>
<body>
  <div id="showcase"></div>
  <div class="title"><h2>Turntable Showcase</h2><p>Pick a finish</p></div>
  <div class="ui" id="variants"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const mount = document.getElementById('showcase');

    // ---- Renderer -----------------------------------------------------------
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    mount.appendChild(renderer.domElement);

    // ---- Scene + studio environment ----------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e1016);

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 1.6, 5.2);
    camera.lookAt(0, 0.6, 0);

    // ---- Floating rounded platform -----------------------------------------
    const platform = new THREE.Mesh(
      new THREE.CylinderGeometry(1.5, 1.5, 0.35, 64),
      new THREE.MeshStandardMaterial({ color: 0x161a26, roughness: 0.55, metalness: 0.2 })
    );
    platform.position.y = -0.35;
    scene.add(platform);

    // A soft accent ring around the platform edge.
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(1.5, 0.03, 16, 80),
      new THREE.MeshStandardMaterial({ color: 0x7c8bff, emissive: 0x2a2f7a, roughness: 0.3 })
    );
    ring.rotation.x = Math.PI / 2;
    ring.position.y = -0.18;
    scene.add(ring);

    // ---- Turntable + product -----------------------------------------------
    const turntable = new THREE.Group();
    scene.add(turntable);

    // Stand-in "product": a smooth rounded shape. Swap for a GLTFLoader model.
    const product = new THREE.Mesh(
      new THREE.TorusKnotGeometry(0.55, 0.19, 220, 32),
      new THREE.MeshStandardMaterial({ color: 0xff5ea8, roughness: 0.25, metalness: 0.6 })
    );
    product.position.y = 0.75;
    turntable.add(product);

    // ---- Lights (env does the heavy lifting; these add shape) --------------
    const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(3, 5, 4);
    const rim = new THREE.DirectionalLight(0x88aaff, 0.8); rim.position.set(-4, 2, -3);
    scene.add(key, rim, new THREE.AmbientLight(0xffffff, 0.25));

    // ---- Material variants (the reusable API of the component) -------------
    const VARIANTS = [
      { name: 'Rose Metal',  color: 0xff5ea8, roughness: 0.25, metalness: 0.7 },
      { name: 'Cobalt Matte', color: 0x4f6cff, roughness: 0.85, metalness: 0.1 },
      { name: 'Chrome',      color: 0xdfe4f2, roughness: 0.05, metalness: 1.0 }
    ];
    function applyVariant(v) {
      product.material.color.setHex(v.color);
      product.material.roughness = v.roughness;
      product.material.metalness = v.metalness;
      product.material.needsUpdate = true;
    }
    // Build the button UI dynamically from the variant list.
    const ui = document.getElementById('variants');
    VARIANTS.forEach((v, i) => {
      const b = document.createElement('button');
      b.innerHTML = `<span class="swatch" style="background:#${v.color.toString(16).padStart(6,'0')}"></span>${v.name}`;
      b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
      b.onclick = () => {
        applyVariant(v);
        [...ui.children].forEach((c, j) => c.setAttribute('aria-pressed', String(i === j)));
      };
      ui.appendChild(b);
    });
    applyVariant(VARIANTS[0]);

    // ---- Animation loop -----------------------------------------------------
    const clock = new THREE.Clock();
    function render() {
      const t = clock.getElapsedTime();
      if (!reduceMotion) {
        turntable.rotation.y = t * 0.5;
        product.rotation.x = t * 0.3;
        product.position.y = 0.75 + Math.sin(t * 1.4) * 0.06; // gentle float
      }
      renderer.render(scene, camera);
    }
    if (reduceMotion) render();
    else renderer.setAnimationLoop(render);

    // ---- Resize -------------------------------------------------------------
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      if (reduceMotion) render();
    });
  </script>
</body>
</html>
